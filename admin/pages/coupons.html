<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coupons — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/coupons.css">
</head>
<body data-page="coupons">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div class="filter-bar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search by code...">
      </div>
      <button class="btn btn-primary" id="addCouponBtn" style="margin-left:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Add Coupon
      </button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Type</th>
              <th>Value</th>
              <th>Min Order</th>
              <th>Expiry</th>
              <th>Usage</th>
              <th>Active</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="couponsBody"></tbody>
        </table>
      </div>
      <div id="couponsEmpty"></div>
    </div>

  </div>
</div>

<!-- Add/Edit Coupon Modal -->
<div class="modal-backdrop" id="couponModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="couponModalTitle">Add Coupon</h3>
      <button class="modal-close" onclick="closeModal('couponModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="couponForm">
        <input type="hidden" id="couponId">
        <div class="field">
          <label for="cCode">Coupon Code</label>
          <input type="text" id="cCode" class="input" placeholder="e.g. WELCOME50" style="text-transform:uppercase;" required>
        </div>
        <div class="field">
          <label>Discount Type</label>
          <div class="type-switch" id="typeSwitch">
            <button type="button" data-type="flat" class="active">₹ Flat</button>
            <button type="button" data-type="percent">% Percent</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cValue" id="cValueLabel">Value (₹)</label>
            <input type="number" id="cValue" class="input" min="0" required>
          </div>
          <div class="field">
            <label for="cMinOrder">Min Order Value (₹)</label>
            <input type="number" id="cMinOrder" class="input" min="0">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cExpiry">Expiry Date</label>
            <input type="date" id="cExpiry" class="input">
          </div>
          <div class="field">
            <label for="cUsageLimit">Usage Limit</label>
            <input type="number" id="cUsageLimit" class="input" min="1" placeholder="Unlimited">
          </div>
        </div>
        <div class="field flex-between mb-0">
          <label class="mb-0" style="margin:0;">Active</label>
          <label class="toggle">
            <input type="checkbox" id="cActive" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('couponModal')">Cancel</button>
      <button class="btn btn-primary" id="saveCouponBtn">Save Coupon</button>
    </div>
  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/coupons.js"></script>
</body>
</html>
