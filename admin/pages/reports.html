<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Reports — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/reports.css">
</head>
<body data-page="reports">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div class="reports-toolbar">
      <input type="date" class="input" id="reportFrom" style="max-width:160px;">
      <span class="text-muted" style="font-size:12px;">to</span>
      <input type="date" class="input" id="reportTo" style="max-width:160px;">
      <button class="btn btn-outline btn-sm" id="applyRangeBtn">Apply</button>
      <button class="btn btn-primary" id="exportCsvBtn" style="margin-left:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        Export CSV
      </button>
    </div>

    <div class="card chart-card">
      <div class="card-header"><h3>Daily Sales Trend</h3></div>
      <div class="chart-wrap" id="salesTrendChart"></div>
    </div>

    <div class="dash-grid-2" style="display:grid; grid-template-columns:1fr 1fr; gap:18px;">
      <div class="card chart-card">
        <div class="card-header"><h3>Top Products</h3></div>
        <div class="chart-wrap" id="topProductsChart"></div>
      </div>

      <div class="card chart-card">
        <div class="card-header"><h3>Delivery Boy Leaderboard</h3></div>
        <div class="chart-wrap" id="leaderboardList"></div>
      </div>
    </div>

  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
