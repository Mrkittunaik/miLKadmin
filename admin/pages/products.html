<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Products — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/products.css">
</head>
<body data-page="products">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div class="filter-bar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search products...">
      </div>
      <select class="select" id="categoryFilter" style="max-width:180px;">
        <option value="">All Categories</option>
      </select>
      <button class="btn btn-primary" id="addProductBtn" style="margin-left:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Add Product
      </button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Discount</th>
              <th>Active</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
      <div id="productsEmpty"></div>
      <div class="pagination" id="pagination"></div>
    </div>

  </div>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal-backdrop" id="productModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="productModalTitle">Add Product</h3>
      <button class="modal-close" onclick="closeModal('productModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="field">
          <label>Product Images</label>
          <div class="upload-grid" id="imageUploadGrid">
            <label class="upload-add">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Add
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
            </label>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pName">Name</label>
            <input type="text" id="pName" class="input" placeholder="e.g. Full Cream Milk" required>
          </div>
          <div class="field">
            <label for="pCategory">Category</label>
            <select id="pCategory" class="select" required>
              <option value="">Select category</option>
              <option value="milk">Milk</option>
              <option value="curd">Curd &amp; Yogurt</option>
              <option value="paneer">Paneer</option>
              <option value="ghee">Ghee &amp; Butter</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="pDescription">Description</label>
          <textarea id="pDescription" class="input" placeholder="Short description shown to customers"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pPrice">Price (₹)</label>
            <input type="number" id="pPrice" class="input" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="pUnit">Unit</label>
            <select id="pUnit" class="select">
              <option value="litre">Litre</option>
              <option value="500ml">500 ml</option>
              <option value="kg">Kg</option>
              <option value="250g">250 g</option>
              <option value="piece">Piece</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pStock">Stock Quantity</label>
            <input type="number" id="pStock" class="input" min="0" required>
          </div>
          <div class="field">
            <label for="pDiscount">Discount (%)</label>
            <input type="number" id="pDiscount" class="input" min="0" max="100">
          </div>
        </div>
        <div class="field flex-between mb-0">
          <label class="mb-0" style="margin:0;">Active</label>
          <label class="toggle">
            <input type="checkbox" id="pActive" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('productModal')">Cancel</button>
      <button class="btn btn-primary" id="saveProductBtn">Save Product</button>
    </div>
  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/products.js"></script>
</body>
</html>
