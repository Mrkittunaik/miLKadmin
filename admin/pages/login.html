<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Login — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="../images/logo.png" alt="Logo" onerror="this.style.display='none'">
      <div style="text-align:center;">
        <div class="login-title">Pakka Doodhwala</div>
        <div class="login-sub">ADMIN PANEL</div>
      </div>
    </div>

    <div class="login-error" id="loginError">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="loginErrorText">Invalid email or password.</span>
    </div>

    <!-- TEMPORARY TEST LOGIN HINT — remove this block once real backend auth is connected -->
    <div style="background:var(--card-hi); border:1px dashed var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:16px; font-size:11.5px; color:var(--muted); line-height:1.6;">
      <b style="color:var(--ink);">Test login (temporary):</b><br>
      Email: <code>admin@test.com</code><br>
      Password: <code>admin123</code>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="admin@pakkadoodhwala.com" required autocomplete="username">
      </div>
      <div class="field mb-0">
        <label for="password">Password</label>
        <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <span id="loginBtnText">Login</span>
      </button>
    </form>

    <div class="login-footnote">Authorized personnel only</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/config.js"></script>
<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
