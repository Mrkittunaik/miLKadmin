<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Order Detail — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/order-detail.css">
</head>
<body data-page="orders">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div id="orderDetailSkeleton">
      <div class="skeleton skeleton-card" style="margin-bottom:14px;"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div class="od-grid" id="orderDetailContent" style="display:none;">
      <div style="display:flex; flex-direction:column; gap:18px;">

        <div class="card card-pad">
          <div class="flex-between" style="margin-bottom:14px;">
            <div>
              <h3 style="margin:0 0 3px; font-size:16px; font-weight:800;">Order <span id="odOrderNumber"></span></h3>
              <div class="td-muted" style="font-size:12px;" id="odDate"></div>
            </div>
            <span id="odStatusBadge"></span>
          </div>
          <div id="odItemsList"></div>
        </div>

        <div class="card card-pad">
          <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Payment Summary</h3>
          <div class="od-summary-row"><span>Subtotal</span><b id="odSubtotal">—</b></div>
          <div class="od-summary-row"><span>Delivery Charge</span><b id="odDeliveryCharge">—</b></div>
          <div class="od-summary-row"><span>Discount</span><b id="odDiscount">—</b></div>
          <div class="od-summary-row total"><span>Total</span><b id="odTotal">—</b></div>
          <div class="od-summary-row"><span>Payment Method</span><b id="odPaymentMethod">—</b></div>
          <div class="od-summary-row"><span>Payment Status</span><b id="odPaymentStatus">—</b></div>
        </div>

        <div class="card card-pad">
          <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Status Timeline</h3>
          <div class="stepper" id="odStepper"></div>
        </div>

      </div>

      <div style="display:flex; flex-direction:column; gap:18px;">

        <div class="card card-pad">
          <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Delivery Address</h3>
          <div class="addr-block">
            <div class="addr-ic">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <div class="addr-text" id="odAddress">—</div>
              <a href="#" target="_blank" class="addr-link" id="odMapLink">Open in Google Maps →</a>
            </div>
          </div>
        </div>

        <div class="card card-pad">
          <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Assigned Delivery Boy</h3>
          <div class="dboy-card" id="odDeliveryBoyBlock">
            <div class="text-muted" style="font-size:12.5px;">Not assigned yet.</div>
          </div>
        </div>

        <div class="card card-pad">
          <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Actions</h3>
          <div class="od-actions">
            <div class="field mb-0">
              <label for="reassignSelect">Reassign Delivery Boy</label>
              <select class="select" id="reassignSelect">
                <option value="">Select delivery boy...</option>
              </select>
            </div>
            <button class="btn btn-yellow btn-block" id="reassignBtn">Reassign</button>
            <button class="btn btn-outline btn-block" id="refundBtn">Mark Refunded</button>
            <button class="btn btn-danger btn-block" id="cancelOrderBtn">Cancel Order</button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- Cancel Order Modal -->
<div class="modal-backdrop" id="cancelModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Cancel Order</h3>
      <button class="modal-close" onclick="closeModal('cancelModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field mb-0">
        <label for="cancelReason">Reason for cancellation</label>
        <textarea id="cancelReason" class="input" placeholder="e.g. Customer requested cancellation"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('cancelModal')">Back</button>
      <button class="btn btn-danger" id="confirmCancelBtn">Cancel Order</button>
    </div>
  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/order-detail.js"></script>
</body>
</html>
