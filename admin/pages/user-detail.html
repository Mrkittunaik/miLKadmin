<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Customer Detail — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/user-detail.css">
</head>
<body data-page="users">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div id="udSkeleton">
      <div class="skeleton skeleton-card" style="margin-bottom:14px;"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div id="udContent" style="display:none;">

      <div class="card card-pad" style="margin-bottom:18px;">
        <div class="flex-between" style="flex-wrap:wrap; gap:14px;">
          <div class="ud-header">
            <div class="ud-avatar" id="udAvatar">U</div>
            <div>
              <div class="ud-name" id="udName">—</div>
              <div class="ud-phone" id="udPhone">—</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="text-muted" style="font-size:12px;">Block Customer</span>
            <label class="toggle"><input type="checkbox" id="udBlockToggle"><span class="toggle-track"></span></label>
          </div>
        </div>
      </div>

      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
        <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="udTotalOrders">0</div></div>
        <div class="stat-card"><div class="stat-label">Total Spent</div><div class="stat-value" id="udTotalSpent">₹0</div></div>
      </div>

      <div class="card card-pad" style="margin-bottom:18px;">
        <h3 style="margin:0 0 14px; font-size:14.5px; font-weight:800;">Saved Addresses</h3>
        <div id="udAddresses"></div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Order History</h3></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Order ID</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="udOrdersBody"></tbody>
          </table>
        </div>
        <div id="udOrdersEmpty"></div>
      </div>

    </div>

  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/user-detail.js"></script>
</body>
</html>
