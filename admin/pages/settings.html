<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Settings — Pakka Doodhwala Admin</title>
<link rel="stylesheet" href="../css/admin-base.css">
<link rel="stylesheet" href="../css/admin-components.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/settings.css">
</head>
<body data-page="settings">
<script src="../js/config.js"></script>
<script src="../js/admin-auth.js"></script>

<div id="admin-app">
  <div id="page-root">

    <div class="card card-pad settings-form-card">
      <form id="settingsForm">

        <div class="field">
          <label for="sMaxOrders">Default Max Concurrent Orders (per delivery boy)</label>
          <input type="number" id="sMaxOrders" class="input" min="1" required>
          <div class="help-text">Used as the default when a new delivery boy is approved. Can be overridden per delivery boy.</div>
        </div>

        <div class="field">
          <label for="sChargeType">Delivery Charge Type</label>
          <select id="sChargeType" class="select">
            <option value="flat">Flat Fee</option>
            <option value="free_above">Free Above Amount</option>
            <option value="per_km">Per Kilometer</option>
          </select>
        </div>

        <div class="field conditional-field" id="flatFeeField">
          <label for="sFlatFee">Flat Delivery Fee (₹)</label>
          <input type="number" id="sFlatFee" class="input" min="0">
        </div>

        <div class="field conditional-field" id="freeAboveField">
          <label for="sFreeAboveAmount">Free Delivery Above (₹)</label>
          <input type="number" id="sFreeAboveAmount" class="input" min="0">
          <div class="help-text">Below this order amount, the fallback flat fee applies.</div>
        </div>
        <div class="field conditional-field" id="freeAboveFallbackField">
          <label for="sFreeAboveFallback">Fallback Fee Below Threshold (₹)</label>
          <input type="number" id="sFreeAboveFallback" class="input" min="0">
        </div>

        <div class="field conditional-field" id="perKmField">
          <label for="sPerKmRate">Rate per Kilometer (₹)</label>
          <input type="number" id="sPerKmRate" class="input" min="0" step="0.5">
        </div>

        <div class="field">
          <label>Store Location</label>
          <div class="map-placeholder" id="storeLocationPicker">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <div id="storeLocationLabel" style="font-size:12.5px; font-weight:600;">Click to set store location</div>
          </div>
          <input type="hidden" id="sStoreLat">
          <input type="hidden" id="sStoreLng">
        </div>

        <button type="submit" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
      </form>
    </div>

  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/admin-ui-helpers.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>
